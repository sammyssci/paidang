<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>羽毛球圈子 - 羽球综合服务平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { mint: { DEFAULT: '#4ECDC4', light: '#A8E6CF', dark: '#3BA99C' } } } }
    }
  </script>
  <link rel="stylesheet" href="css/common.css">
</head>
<body>
  <div id="topNav"></div>

  <div class="page-layout">
    <!-- 左侧：分区贴吧列表 -->
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
      <!-- ========== 吧头信息 ========== -->
      <div class="forum-header" id="forumHeader">
        <h1 class="text-2xl font-bold" id="forumName">羽毛球圈子</h1>
        <p class="opacity-90 mt-1" id="forumDesc">选择左侧分区进入对应羽球吧</p>
        <div class="flex gap-6 mt-3 text-sm opacity-80 flex-wrap">
          <span id="forumMembers">成员: --</span>
          <span id="forumOnline">在线: --</span>
          <span id="forumTodayPosts">今日发帖: --</span>
        </div>
        <div class="mt-3 p-3 bg-white/20 rounded-lg text-sm" id="forumNotice" style="display:none;">
          📢 吧主公告：<span id="forumNoticeText"></span>
        </div>
      </div>

      <!-- ========== 搜索栏 ========== -->
      <div class="filter-bar">
        <div class="search-box flex-1">
          <input type="text" id="searchInput" placeholder="搜索帖子、用户、关键词...">
          <select class="form-select w-32" id="searchType">
            <option value="posts">搜帖子</option>
            <option value="users">搜用户</option>
            <option value="keyword">搜关键词</option>
          </select>
          <button class="btn btn-primary" id="searchBtn">搜索</button>
        </div>
      </div>

      <!-- ========== 社区动态 ========== -->
      <div class="community-activity-bar" id="activityBar"></div>

      <!-- ========== 排序筛选 ========== -->
      <div class="filter-bar">
        <span class="filter-chip active" data-sort="hot">🔥 热门</span>
        <span class="filter-chip" data-sort="newest">🕐 最新发布</span>
        <span class="filter-chip" data-sort="essence">⭐ 精华置顶</span>
        <span class="filter-chip" data-sort="author">👤 只看楼主</span>
      </div>

      <!-- ========== 在线球友 ========== -->
      <div class="card mb-4" id="onlineUsersCard">
        <div class="card-header">🟢 在线球友</div>
        <div class="card-body flex flex-wrap gap-2" id="onlineUsers"></div>
      </div>

      <!-- ========== 帖子列表 ========== -->
      <div id="postsList"></div>

      <!-- ========== 帖子详情弹窗 ========== -->
      <div class="modal-overlay" id="postDetailModal">
        <div class="modal modal-lg">
          <div class="modal-header">
            <h3 id="postDetailTitle">帖子详情</h3>
            <button class="modal-close">&times;</button>
          </div>
          <div class="modal-body" id="postDetailBody"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- 悬浮发帖按钮 -->
  <button class="fab-post" id="fabPostBtn" title="发布帖子">+</button>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/video-library.js"></script>
  <script src="js/community-seed.js"></script>
  <script src="js/player-extra.js"></script>
  <script src="js/venue-images.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/community.js"></script>
</body>
</html>
