<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频AI分析 - 羽球综合服务平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { mint: { DEFAULT: '#4ECDC4', light: '#A8E6CF', dark: '#3BA99C' } } } }
    }
  </script>
  <link rel="stylesheet" href="css/common.css">
</head>
<body>
  <div id="topNav"></div>

  <div class="page-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
      <h1 class="text-2xl font-bold mb-6 text-gray-800">🎬 羽毛球视频 AI 分析</h1>

      <!-- ========== 视频导入区 ========== -->
      <section class="card mb-6">
        <div class="card-header">导入视频</div>
        <div class="card-body">
          <div class="form-tabs mb-4">
            <div class="form-tab active" data-import="upload">本地上传</div>
            <div class="form-tab" data-import="url">在线链接</div>
          </div>
          <!-- 本地上传 -->
          <div id="uploadPanel">
            <div class="form-group">
              <label class="form-label">选择你的羽毛球视频（不限制大小）</label>
              <input type="file" class="form-input" id="videoFile" accept="video/*,.mp4,.webm,.mov,.avi,.mkv,.m4v,.flv,.wmv,.mpeg,.mpg,.3gp">
              <p class="text-sm text-gray-500 mt-2" id="videoFileHint">支持 mp4 / webm / mov / avi / mkv 等常见格式，文件大小<strong>不限</strong>，大视频自动存入浏览器 IndexedDB。</p>
              <p class="text-sm text-mint-dark mt-1 hidden" id="videoFileInfo"></p>
            </div>
            <div class="form-group">
              <label class="form-label">分析标题</label>
              <input type="text" class="form-input" id="videoTitle" placeholder="例如：正手高远球练习">
            </div>
            <button class="btn btn-primary" id="uploadAnalyzeBtn">上传并开始AI分析</button>
          </div>
          <!-- 在线链接 -->
          <div id="urlPanel" style="display:none;">
            <div class="form-group">
              <label class="form-label">粘贴视频URL</label>
              <input type="text" class="form-input" id="videoUrl" placeholder="粘贴 B 站链接，如 https://www.bilibili.com/video/BV16t411D7ke?p=14">
            </div>
            <div class="form-group">
              <label class="form-label">分析标题</label>
              <input type="text" class="form-input" id="videoUrlTitle" placeholder="例如：杀球动作分析">
            </div>
            <button class="btn btn-primary" id="urlAnalyzeBtn">导入并开始AI分析</button>
          </div>
        </div>
      </section>

      <!-- ========== AI分析进度 ========== -->
      <section class="card mb-6" id="analysisProgress" style="display:none;">
        <div class="card-body text-center py-8">
          <div class="loading-spinner"></div>
          <p class="mt-4 text-gray-600" id="progressText">AI 正在分析视频...</p>
          <div class="progress-bar max-w-md mx-auto"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        </div>
      </section>

      <!-- ========== 视频播放与分析结果 ========== -->
      <section id="analysisResult" style="display:none;">
        <div class="grid grid-cols-3 gap-6 mb-6">
          <!-- 视频播放器 -->
          <div class="col-span-2">
            <div class="card">
              <div class="card-header">
                <span id="resultTitle">分析结果</span>
                <div class="flex gap-2">
                  <button class="btn btn-sm btn-secondary" id="pauseBtn">⏸ 暂停</button>
                  <button class="btn btn-sm btn-secondary" id="clipBtn">✂️ 裁剪片段</button>
                </div>
              </div>
              <div class="card-body p-0">
                <div class="video-container" id="analysisVideoWrap">
                  <!-- 由 VideoLib 动态挂载 B站教学 iframe 或本地 video -->
                </div>
                <!-- 裁剪控制 -->
                <div class="p-4 border-t" id="clipControls" style="display:none;">
                  <label class="form-label">裁剪区间（秒）</label>
                  <div class="flex gap-4 items-center">
                    <input type="number" class="form-input w-24" id="clipStart" value="0" min="0" step="0.1">
                    <span>至</span>
                    <input type="number" class="form-input w-24" id="clipEnd" value="5" min="0" step="0.1">
                    <button class="btn btn-sm btn-primary" id="applyClipBtn">应用裁剪</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <!-- 动作识别标签 -->
          <div>
            <div class="card mb-4">
              <div class="card-header">🏸 识别动作</div>
              <div class="card-body" id="actionTags"></div>
            </div>
            <div class="card">
              <div class="card-header">📈 速度与落点</div>
              <div class="card-body">
                <p>击球速度: <strong id="speedValue">--</strong> km/h</p>
                <p class="mt-2">落点分析: <strong id="landingValue">--</strong></p>
              </div>
            </div>
          </div>
        </div>

        <!-- 可视化分析 -->
        <div class="analysis-panel mb-6">
          <div class="card">
            <div class="card-header">🎯 击球热力图</div>
            <div class="card-body">
              <canvas id="heatmapCanvas" class="heatmap-canvas" width="400" height="200"></canvas>
            </div>
          </div>
          <div class="card">
            <div class="card-header">👣 步伐轨迹示意</div>
            <div class="card-body">
              <canvas id="trajectoryCanvas" class="trajectory-canvas" width="400" height="200"></canvas>
            </div>
          </div>
        </div>

        <!-- 动作分帧预览 -->
        <div class="card mb-6">
          <div class="card-header">🎞 动作分解分帧</div>
          <div class="card-body">
            <div class="frame-preview" id="framePreview"></div>
          </div>
        </div>

        <!-- 失误点与点评 -->
        <div class="grid grid-cols-2 gap-6 mb-6">
          <div class="card">
            <div class="card-header">⚠️ 失误点标记</div>
            <div class="card-body" id="mistakesList"></div>
          </div>
          <div class="card">
            <div class="card-header">✅ 优点 / ❌ 不足</div>
            <div class="card-body">
              <h4 class="font-semibold text-mint-dark mb-2">优点</h4>
              <ul id="prosList" class="list-disc pl-5 mb-4"></ul>
              <h4 class="font-semibold text-red-500 mb-2">不足</h4>
              <ul id="consList" class="list-disc pl-5"></ul>
            </div>
          </div>
        </div>

        <!-- 训练建议 -->
        <div class="card mb-6">
          <div class="card-header">💡 针对性纠正训练建议</div>
          <div class="card-body" id="suggestionsList"></div>
        </div>

        <!-- 操作按钮 -->
        <div class="flex gap-4 mb-8">
          <button class="btn btn-primary" id="saveReportBtn">💾 保存分析报告</button>
          <button class="btn btn-secondary" id="shareCircleBtn">📤 分享到圈子</button>
          <button class="btn btn-secondary" id="favoriteVideoBtn">⭐ 收藏视频</button>
        </div>
      </section>

      <!-- ========== 历史分析记录 ========== -->
      <section class="card">
        <div class="card-header">
          <span>📋 历史分析记录</span>
          <span class="text-sm text-gray-500" id="historyCount">0 条</span>
        </div>
        <div class="card-body p-0" id="historyList"></div>
      </section>
    </main>
  </div>

  <!-- 分享弹窗 -->
  <div class="modal-overlay" id="shareModal">
    <div class="modal">
      <div class="modal-header">
        <h3>分享到圈子</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="shareForm">
          <div class="form-group">
            <label class="form-label">选择分区</label>
            <select class="form-select" id="shareForum"></select>
          </div>
          <div class="form-group">
            <label class="form-label">帖子标题</label>
            <input type="text" class="form-input" id="shareTitle">
          </div>
          <div class="form-group">
            <label class="form-label">附加说明</label>
            <textarea class="form-textarea" id="shareContent" rows="3"></textarea>
          </div>
          <button type="submit" class="btn btn-primary w-full">发布到圈子</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/video-storage.js"></script>
  <script src="js/video-library.js"></script>
  <script src="js/community-seed.js"></script>
  <script src="js/player-extra.js"></script>
  <script src="js/venue-images.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/video-analysis.js"></script>
</body>
</html>
